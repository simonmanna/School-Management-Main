# nginx for the portal SPA.
#
# Stricter than nginx.conf, because this app is the one on the public internet.
# The admin app sits on the school's own network behind whatever the school
# already controls; a guardian opens this from a phone on mobile data, and the
# session token lives in localStorage — so any script injection is a stolen
# session. The CSP below is the difference between "hard" and "one XSS away".
server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the shell: a stale index.html points at asset hashes that no
    # longer exist, and the app fails to boot with nothing on screen to explain it.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ── Security headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Content-Security-Policy.
    #
    # `connect-src` must name the API origin — the portal is served from
    # portal.<school> and calls api.<school>, which is cross-origin. Substitute
    # the real hostname when deploying; leaving the placeholder means the app
    # loads and every request is blocked by the browser.
    #
    # `style-src` allows inline styles because the app sets a few element styles
    # directly (progress bars, safe-area padding). Scripts have no such
    # exemption: no 'unsafe-inline', no 'unsafe-eval'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://API_ORIGIN_PLACEHOLDER; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
