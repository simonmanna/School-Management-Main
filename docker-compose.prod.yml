# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# OPS-03 — the default stack is not deployable as-is. In docker-compose.yml,
# Caddy sits behind `profiles: ["public"]`, so the default `up` serves plaintext
# HTTP while publishing Postgres (5433), unauthenticated Redis (6379), the API
# (3000), web (5173) and the portal (5175) on every interface. This overlay
# inverts that: TLS is on, and nothing else reaches the host.
#
# `!reset` is required. `ports: []` is a no-op — Compose concatenates the
# multi-value options, so an empty list leaves the inherited mapping in place.
#
# OPS-04 — the base file connects as the `cafe-pos` role, which the postgres
# image creates as a SUPERUSER, while also setting NODE_ENV=production. That
# combination trips the startup guard in PrismaService (it refuses a
# superuser/BYPASSRLS role in production) and the stack cannot boot. The fix is
# to supply the non-superuser application role created by
# scripts/setup-rls-role.ts — NOT to set RLS_ALLOW_SUPERUSER. `:?` makes Compose
# refuse to start rather than fall back to the superuser URL.

services:
  db:
    container_name: school-db
    ports: !reset []

  redis:
    container_name: school-redis
    ports: !reset []

  api:
    container_name: school-api
    ports: !reset []
    # Backups outlive the container. Copy them off this host too — see
    # docs/operations/backup-and-restore.md (offsite copy is not optional).
    volumes:
      - backups:/app/var/backups
    environment:
      # Non-superuser, NOBYPASSRLS application role. See scripts/setup-rls-role.ts.
      DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL to the non-superuser app role — see scripts/setup-rls-role.ts}
      # BYPASSRLS system role for pre-tenant lookups (login, refresh, cron
      # fan-out). The API refuses to boot in production without it once RLS is live.
      SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:?set SYSTEM_DATABASE_URL to the app_system role — see scripts/setup-rls-role.ts}
      # Migrations run as the owner; the application never does.
      DIRECT_URL: ${MIGRATOR_DATABASE_URL:?set MIGRATOR_DATABASE_URL to the migration role}
      NODE_ENV: production
      LOG_LEVEL: info
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:?set PROD_CORS_ORIGINS}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      # SEC-06: refuse any route without an explicit authorization policy.
      PERMISSIONS_FAIL_CLOSED: "true"
      # Permissions and account state are re-read per request, so revoking a
      # role or deactivating a user takes effect immediately.
      PERMISSIONS_DB_LOOKUP: "true"
      # Links in invitation / password-reset / portal emails point here.
      WEB_URL: ${WEB_URL:?set WEB_URL to the public staff web address, e.g. https://school.example.ug}
      PORTAL_URL: ${PORTAL_URL:?set PORTAL_URL to the public parent portal address}
      # Operator-only: creating a new school. Leave unset to keep it closed.
      PROVISIONING_SECRET: ${PROVISIONING_SECRET:-}
      # Parent alerts: the school's own SMS gateway (Communication → Channels).
      ENABLE_COMMUNICATION_SMS: "true"
      COMM_ENCRYPTION_KEY: ${COMM_ENCRYPTION_KEY:?set COMM_ENCRYPTION_KEY (openssl rand -base64 32)}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-+256}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM to the school's sending address}
      # SCOPE-01: first-release scope. Everything absent here is off.
      ENABLE_SCHOOL: "true"
      ENABLE_HR: "true"
      ENABLE_COMMUNICATION: "true"
      ENABLE_ADVANCED_LMS: "false"
      ENABLE_MANUFACTURING: "false"
      ENABLE_RENTAL: "false"
      ENABLE_REPAIR: "false"
      ENABLE_BEVERAGE: "false"
      ENABLE_ASSETS: "false"
      ENABLE_TASKS: "false"
      ENABLE_ORDERS: "false"
      # ADR-032 P6 / audit F13: no live MTN/Airtel collection at launch.
      ENABLE_LIVE_MOBILE_MONEY: "false"
      # Audit F12: backups and the weekly restore drill need a BYPASSRLS role
      # with CREATEDB; the app role cannot see every school's rows.
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?set BACKUP_DATABASE_URL to a BYPASSRLS role with CREATEDB — see docs/operations/backup-and-restore.md}
      BACKUP_DIR: /app/var/backups

  # Audit F10: the browser bundles are built for THIS deployment. The API
  # address is compiled in, and a remote user's "localhost" is their own phone,
  # so both apps call the API on their own origin (/api/v1) and Caddy routes it.
  # The capability flags mirror ENABLE_* on the api service above exactly —
  # change one, change both, then rebuild (--build).
  web:
    container_name: school-web
    ports: !reset []
    build:
      args:
        VITE_API_URL: ""
        VITE_ENABLE_SCHOOL: "true"
        VITE_ENABLE_HR: "true"
        VITE_ENABLE_COMMUNICATION: "true"
        VITE_ENABLE_ADVANCED_LMS: "false"
        VITE_ENABLE_ORDERS: "false"
        VITE_ENABLE_BEVERAGE: "false"
        VITE_ENABLE_ASSETS: "false"
        VITE_ENABLE_TASKS: "false"
        VITE_ENABLE_MANUFACTURING: "false"
        VITE_ENABLE_RENTAL: "false"
        VITE_ENABLE_REPAIR: "false"
        VITE_ENABLE_LIVE_MOBILE_MONEY: "false"

  portal:
    container_name: school-portal
    ports: !reset []
    build:
      args:
        VITE_API_URL: ""
        # The school's organization code and display name: the portal login
        # asks families for nothing else. No demo fallback in production.
        VITE_ORG_CODE: ${PORTAL_ORG_CODE:?set PORTAL_ORG_CODE to the school's organization code}
        VITE_SCHOOL_NAME: ${PORTAL_SCHOOL_NAME:?set PORTAL_SCHOOL_NAME to the school's name}
        VITE_ENABLE_ADVANCED_LMS: "false"

  # An unauthenticated database console has no place in a production stack.
  # Start it deliberately, through a tunnel: --profile operator-tools
  adminer:
    profiles: ["operator-tools"]

  # The only service that touches the host. Base file hides it behind the
  # "public" profile; production is exactly when it must run.
  caddy:
    container_name: school-caddy
    profiles: !reset []

volumes:
  backups:
