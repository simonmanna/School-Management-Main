services:
  db:
    image: postgres:16-alpine
    container_name: cafe-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe-pos
      POSTGRES_PASSWORD: cafe-pos
      POSTGRES_DB: cafe-pos
    # Host port 5433 to avoid clashing with a locally-installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe-pos -d cafe-pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cafe-pos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: cafe-pos-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cafe-pos:cafe-pos@db:5432/cafe-pos?schema=public
      REDIS_URL: redis://redis:6379
      # No defaults on purpose. `:?` makes compose refuse to start when unset,
      # which is the only reliable way to stop a shared placeholder secret from
      # reaching production. Generate with: openssl rand -base64 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_POS_SECRET: ${JWT_POS_SECRET:?set JWT_POS_SECRET in .env}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: info
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/var/uploads
      BODY_LIMIT: 5mb
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@cafe-pos.local}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/var/uploads

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_URL: http://localhost:3000
    container_name: cafe-pos-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

  # The student / guardian / teacher portal.
  #
  # A separate image from `web` because it is a separate app for a separate
  # audience: a guardian on mobile data must not download the back-office ERP to
  # check a fee balance. VITE_ORG_CODE is baked in so the login form can ask for
  # an email and a password and nothing else.
  portal:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.portal
      args:
        VITE_API_URL: ${PORTAL_API_URL:-http://localhost:3000}
        VITE_ORG_CODE: ${PORTAL_ORG_CODE:-DEMO}
        VITE_SCHOOL_NAME: ${PORTAL_SCHOOL_NAME:-School Portal}
    container_name: school-portal
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5175:80"

  adminer:
    image: adminer:latest
    container_name: cafe-pos-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bound to loopback, not 0.0.0.0. This is an unauthenticated database console;
    # on a host with a public IP the previous mapping published it to the internet.
    # Reach it through an SSH tunnel or Tailscale.
    ports:
      - "127.0.0.1:8080:8080"

  # TLS for a public deployment. Off by default — start it with:
  #   docker compose --profile public up -d
  # Requires SCHOOL_DOMAIN and ACME_EMAIL, and DNS already pointing here.
  caddy:
    image: caddy:2-alpine
    container_name: school-caddy
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - api
      - portal
    environment:
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:?set SCHOOL_DOMAIN in .env, e.g. school.ac.ug}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env for certificate expiry notices}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
