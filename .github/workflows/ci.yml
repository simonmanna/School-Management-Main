name: CI

# The ADRs describe several rules as "CI-enforced" (ADR-011's boundary contract
# most of all), but until this file existed nothing enforced them except a
# developer remembering to run `pnpm verify`. That matters most for
# `tenancy-registration.spec.ts`, whose failure mode — a model missing from
# ORG_SCOPED — leaks rows across tenants silently.
#
# Scope note — two pre-existing debts, both unrelated to the school vertical and
# tracked separately:
#   1. `typecheck` fails on apps/api/test/integration/{invoice-to-payment,
#      pos-print-lifecycle}.spec.ts — each creates a `Document` without the
#      `documentTypeId` that became required with the DMS registry, so neither
#      has compiled since.
#   2. Several test/integration/*.spec.ts fail at module init because their
#      hand-built testing modules drifted from current constructors (e.g.
#      RecurringService now needs DmsTypeResolver). They also require a seeded
#      DB. So the `Test` step below runs everything EXCEPT test/integration —
#      that keeps a meaningful green baseline (unit + kernel + module specs,
#      including the tenancy-registration guard) that catches regressions now,
#      instead of a perpetually-red job. Re-include integration once its
#      harnesses are repaired.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://cafe-pos:cafe-pos@localhost:5432/cafe-pos?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe-pos
          POSTGRES_PASSWORD: cafe-pos
          POSTGRES_DB: cafe-pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe-pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated client is an input to both typecheck and the specs.
      - name: Generate Prisma client
        run: pnpm db:generate

      # ADR-011: no upward or cross-vertical imports. Runs in ~3s and is the
      # cheapest signal, so it goes first.
      - name: Architecture boundaries
        run: pnpm lint:arch

      - name: Build shared contracts
        run: pnpm shared:build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Applies migrations so any DB-backed spec runs against a real schema.
      - name: Apply migrations
        run: pnpm --filter @erp/api exec prisma migrate deploy

      # Unit + kernel + module specs (excludes the drifted test/integration
      # harnesses — see the scope note at the top of this file).
      - name: Test (unit + module)
        run: pnpm --filter @erp/api exec jest --testPathIgnorePatterns test/integration --forceExit

      # The school vertical's own integration specs DO run against the CI
      # Postgres — they're self-contained (seed their own currency) and the CI
      # DB role bypasses RLS. --runInBand avoids the cross-suite DB contention
      # that makes the parallel run flaky.
      - name: Test (school integration)
        run: pnpm --filter @erp/api exec jest test/integration/school-happy-path test/integration/school-tenant-isolation test/integration/school-library-fine --runInBand --forceExit
