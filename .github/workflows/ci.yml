name: CI

# The ADRs describe several rules as "CI-enforced" (ADR-011's boundary contract
# most of all), but until this file existed nothing enforced them except a
# developer remembering to run `pnpm verify`. That matters most for
# `tenancy-registration.spec.ts`, whose failure mode — a model missing from
# ORG_SCOPED — leaks rows across tenants silently.
#
# Phase 0 of the production-readiness plan added the gates below. Before it:
#   - QA-01: 55 of 56 integration suites reported PASS with no database, because
#     `_setup.ts` exported `describe.skip` when DATABASE_URL was unset. Jest is
#     now split into `unit` and `integration` projects, and the integration
#     project hard-fails without a database.
#   - QA-04: ~30 existing integration suites (fees integrity/concurrency,
#     admissions concurrency, payroll, reporting) were never run by CI at all.
#   - OPS-02: the runtime image was never built, so a Dockerfile that shipped an
#     ungenerated Prisma client went unnoticed.
#   - OPS-03: nothing checked which ports a rendered Compose merge publishes.
#
# No test step uses --forceExit: leaked handles are defects, not output to
# suppress.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://cafe-pos:cafe-pos@localhost:5432/cafe-pos?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest
    # No test step uses --forceExit, so a leaked handle hangs rather than
    # fails. The unit project currently leaks (see KNOWN_FAILURES.md #7):
    # the run itself takes ~2 minutes, then Jest refuses to exit. A bounded
    # timeout turns that into a legible failure instead of a stuck runner.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe-pos
          POSTGRES_PASSWORD: cafe-pos
          POSTGRES_DB: cafe-pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe-pos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated client is an input to both typecheck and the specs.
      - name: Generate Prisma client
        run: pnpm db:generate

      # ADR-011: no upward or cross-vertical imports. Runs in ~3s and is the
      # cheapest signal, so it goes first.
      - name: Architecture boundaries
        run: pnpm lint:arch

      - name: Build shared contracts
        run: pnpm shared:build

      - name: Academic architecture inventory is current
        run: pnpm academics:inventory:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # QA-05: the two SPAs are typechecked and linted by the recursive steps
      # above, but were never actually built — a bundling or import-resolution
      # failure would only have surfaced at deploy time.
      - name: Build web and portal
        run: pnpm --filter @erp/web build && pnpm --filter @erp/portal build

      # Applies migrations so any DB-backed spec runs against a real schema.
      - name: Apply migrations
        run: pnpm --filter @erp/api exec prisma migrate deploy

      # DB-02: EnrollmentPlacement_no_overlap is created inside an exception
      # handler, so a missing btree_gist extension leaves the migration
      # "successful" and the constraint absent. Fail here instead of discovering
      # it when a learner appears in two classes at once.
      - name: Schema preflight (constraints that can silently not exist)
        run: node scripts/assert-db-constraints.mjs

      # Wave 16: the migrated database and schema.prisma must agree. Prisma
      # ignores partial indexes, so the raw-SQL ones are guarded by the
      # preflight above; everything else it can see must match exactly.
      - name: Schema drift (migrations vs schema.prisma)
        run: pnpm --filter @erp/api exec prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      # F-01/F-02: provision the production runtime roles (`app` NOBYPASSRLS,
      # `app_system` BYPASSRLS) so the RLS specs run the real PrismaService
      # against them instead of skipping. The rest of the suite keeps the owner.
      - name: Provision RLS runtime roles
        run: pnpm --filter @erp/api rls:setup-role
        env:
          RLS_APP_PASSWORD: ci-app
          RLS_SYSTEM_PASSWORD: ci-system

      # The unit project also carries the authorization ratchets —
      # route-permission coverage, role-preset segregation-of-duty invariants,
      # the permission catalogue and tenancy registration. They are cheap, and
      # they are the ones that fail silently if nobody runs them.
      - name: Test (unit)
        run: pnpm --filter @erp/api exec jest --selectProjects unit --runInBand --detectOpenHandles

      # QA-04. This replaces a curated list of four named specs plus four
      # academic phase scripts. Roughly 30 suites covering launch-blocking
      # workflows — fees integrity and concurrency, admissions concurrency,
      # payroll, reporting, teacher ownership, tenant isolation — existed in
      # test/integration and were never a gate. Selecting the whole project
      # rather than naming paths means a new spec cannot be invisible to CI,
      # which is what let the enumerated phase scripts drift.
      #
      # --runInBand is deliberate: every suite seeds into one shared schema, so
      # the previous --maxWorkers=4 raced suites against each other. The
      # trade-off is wall-clock time, paid once here instead of in a pilot.
      - name: Test (integration)
        run: pnpm --filter @erp/api exec jest --selectProjects integration --runInBand --detectOpenHandles
        env:
          RLS_APP_DATABASE_URL: postgresql://app:ci-app@localhost:5432/cafe-pos?schema=public
          RLS_SYSTEM_DATABASE_URL: postgresql://app_system:ci-system@localhost:5432/cafe-pos?schema=public

  # OPS-02 — build the artifact that actually ships, and prove it can start.
  # The previous Dockerfile ran `prisma generate` only in the build stage and
  # never copied node_modules into the runtime stage, so the shipped image
  # resolved @prisma/client to an ungenerated stub. Compiling the source cannot
  # catch that; building and booting the image can.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the API runtime image
        run: docker build -f infra/docker/Dockerfile.api -t school-api:ci .

      # Audit 2026-09-29 A05: resolve @prisma/client from apps/api, as the API
      # does. From /app (the pnpm root) the package is not resolvable at all.
      - name: Generated Prisma client is present in the shipped image
        run: |
          docker run --rm -w /app/apps/api school-api:ci node -e "const { Prisma } = require('@prisma/client'); const n = Prisma.dmmf?.datamodel?.models?.length ?? 0; if (!n) { console.error('FATAL: @prisma/client is an ungenerated stub'); process.exit(1); } console.log('prisma client OK:', n, 'models');"

      # Audit 2026-09-29 A05: boot the shipped image the way production does —
      # NODE_ENV=production, migrated PostgreSQL 16, the NOBYPASSRLS `app` and
      # BYPASSRLS `app_system` roles — and require READINESS (database reachable
      # through the app role), not just liveness of the Node process.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: PostgreSQL 16 with migrations and runtime roles
        run: |
          docker run -d --name ci-db -p 5432:5432             -e POSTGRES_USER=cafe-pos -e POSTGRES_PASSWORD=cafe-pos -e POSTGRES_DB=cafe-pos             postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -U cafe-pos && break
            sleep 2
          done
          pnpm --filter @erp/api exec prisma migrate deploy
          node scripts/assert-db-constraints.mjs
          pnpm --filter @erp/api rls:setup-role
        env:
          DATABASE_URL: postgresql://cafe-pos:cafe-pos@localhost:5432/cafe-pos?schema=public
          RLS_APP_PASSWORD: ci-app
          RLS_SYSTEM_PASSWORD: ci-system

      - name: API boots in production mode and serves readiness
        run: |
          docker run -d --name ci-api --network host             -e NODE_ENV=production             -e DATABASE_URL="postgresql://app:ci-app@localhost:5432/cafe-pos?schema=public"             -e SYSTEM_DATABASE_URL="postgresql://app_system:ci-system@localhost:5432/cafe-pos?schema=public"             -e JWT_ACCESS_SECRET=ci-access-secret-0123456789abcdef0123456789             -e JWT_REFRESH_SECRET=ci-refresh-secret-0123456789abcdef012345678             -e JWT_POS_SECRET=ci-pos-secret-0123456789abcdef0123456789abcd             -e WEB_URL=https://school.example -e PORTAL_URL=https://portal.school.example             -e CORS_ORIGINS=https://school.example -e METRICS_TOKEN=ci-metrics             -e PERMISSIONS_FAIL_CLOSED=true -e PERMISSIONS_DB_LOOKUP=true             -e ENABLE_SCHOOL=true -e ENABLE_HR=true -e ENABLE_COMMUNICATION=true             -e ENABLE_COMMUNICATION_SMS=true -e COMM_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=             -e ENABLE_ADVANCED_LMS=false -e ENABLE_LIVE_MOBILE_MONEY=false             -e SMTP_FROM=ci@school.example             school-api:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/health/ready; then
              echo
              echo "API is ready in production mode"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/v1/health/ready >/dev/null
          # Operator-only surfaces stay closed without the host secret (A03).
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/admin/backups/status)
          test "$code" = "403" || { echo "backup API answered $code without the operator secret"; exit 1; }
          # Retired legacy homework reads (A01) need auth first; anonymous is 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/school/submissions)
          test "$code" = "401" || { echo "legacy submissions answered $code anonymously"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker logs ci-api || true

  # OPS-03 — assert the RENDERED port set. `ports: []` in an overlay is a no-op:
  # Compose concatenates multi-value options, so the staging overlay looked
  # hardened while Postgres (5433) and Redis (6379) stayed published on every
  # interface. Only the merged output tells the truth.
  compose-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JWT_ACCESS_SECRET: ci
      JWT_REFRESH_SECRET: ci
      JWT_POS_SECRET: ci
      SCHOOL_DOMAIN: school.example
      ACME_EMAIL: ci@school.example
      METRICS_TOKEN: ci
      PORTAL_ORG_CODE: CI
      STAGING_CORS_ORIGINS: https://staging.school.example
      STAGING_API_URL: https://staging.school.example
      PROD_CORS_ORIGINS: https://school.example
      APP_DATABASE_URL: postgresql://app:ci@db:5432/school
      SYSTEM_DATABASE_URL: postgresql://app_system:ci@db:5432/school
      MIGRATOR_DATABASE_URL: postgresql://migrator:ci@db:5432/school
      # Audit 2026-09-29 A05: every `${VAR:?}` in the merged production file
      # needs a nonsecret CI fixture, or rendering fails before any assertion.
      WEB_URL: https://school.example
      PORTAL_URL: https://portal.school.example
      COMM_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      SMTP_FROM: ci@school.example
      BACKUP_DATABASE_URL: postgresql://school_backup:ci@db:5432/school
      PORTAL_SCHOOL_NAME: CI School
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Render with no developer .env: a missing required variable fails here,
      # not on the host at deploy time.
      - name: Production and staging files render with CI fixtures only
        run: |
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose --env-file /dev/null -f docker-compose.yml -f docker-compose.staging.yml config -q

      - name: Production overlay publishes only Caddy 80/443
        run: node scripts/assert-compose-ports.mjs docker-compose.yml docker-compose.prod.yml

      - name: Staging overlay publishes nothing beyond loopback
        run: node scripts/assert-compose-ports.mjs docker-compose.yml docker-compose.staging.yml
